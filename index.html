<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microestadio en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* ===== Colores del tablero del Microestadio ===== */
  :root{
    --naranja:#FF5C01; --naranja2:#e24f00; --amarillo:#E1FB00; --verde:#00E640;
    --negro:#050505; --gris:#3e3e3e; --blanco:#ffffff; --rojo:#e8141b;
    --u: min(1vw, 1.6vh);            /* unidad de tamaño: se adapta a celular, web y pantalla */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--naranja);color:var(--blanco);font-family:Montserrat,Arial,sans-serif;font-weight:800}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
    .trazo{ text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 3px 6px rgba(0,0,0,.45) }
  .wrap{width:min(100%, 1400px);padding:calc(var(--u)*2) 16px calc(var(--u)*3)}

  header{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
  #titulo{font-weight:900;font-size:clamp(20px, calc(var(--u)*3.6), 60px);line-height:1;white-space:pre-line}
  .pill{font-size:clamp(11px, calc(var(--u)*1.4), 20px);padding:.35em .8em;border-radius:99px;background:var(--negro);letter-spacing:.06em;display:inline-flex;align-items:center;gap:.45em}
  .pill .p{width:.65em;height:.65em;border-radius:50%;background:var(--rojo);animation:lat 1.2s infinite}
  .pill.final .p{background:#888;animation:none}
  @keyframes lat{50%{opacity:.25}}

  /* ===== marcador ===== */
  .marcador{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:clamp(8px,calc(var(--u)*2),40px);margin-top:calc(var(--u)*2)}
  .equipo{display:flex;flex-direction:column;align-items:center;min-width:0}
  .logo{width:clamp(90px, calc(var(--u)*17), 300px);aspect-ratio:1/1.04;background:#fff;border:4px solid #000;border-radius:18% 18% 6px 6px;display:grid;place-items:center;overflow:hidden}
  .logo img{max-width:82%;max-height:82%}
  .colores{display:flex;width:clamp(90px, calc(var(--u)*17), 300px);height:clamp(10px,calc(var(--u)*1.6),24px);border:4px solid #000;border-top:0}
  .colores i{flex:1}
  .nombre{margin-top:10px;background:var(--negro);color:#E4FF00;font-weight:900;font-size:clamp(15px, calc(var(--u)*3), 50px);padding:.2em .6em;border-radius:6px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .centro{display:flex;flex-direction:column;align-items:center}
  .goles{font-family:Anton,Impact,sans-serif;color:var(--amarillo);font-size:clamp(64px, calc(var(--u)*17), 300px);line-height:1;display:flex;align-items:center;gap:.12em;
         -webkit-text-stroke: clamp(3px,calc(var(--u)*.7),12px) #000; paint-order:stroke fill}
  .goles .guion{font-size:.45em}
  .reloj{margin-top:calc(var(--u)*1.2);background:var(--gris);border-radius:clamp(12px,calc(var(--u)*2.5),40px);padding:.12em .5em .18em;text-align:center;border:3px solid transparent}
  .reloj b{display:block;font-weight:900;font-size:clamp(34px, calc(var(--u)*7.5), 130px);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:#E6FFFF;line-height:1.05}
  .reloj b.ult{color:var(--amarillo)}
  .reloj span{font-family:Anton,Impact,sans-serif;font-size:clamp(14px, calc(var(--u)*2.4), 40px);letter-spacing:.02em}
  .reloj.minuto{background:#000;border-color:var(--amarillo)}

  /* ===== datos de cada equipo ===== */
  .datos{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,calc(var(--u)*4),80px);margin-top:calc(var(--u)*2.5)}
  .col{display:flex;flex-direction:column;gap:calc(var(--u)*1.2);align-items:flex-start}
  .col.der{align-items:flex-end;text-align:right}
  .faltas{font-weight:900;font-size:clamp(20px, calc(var(--u)*4), 64px)}
  .faltas b.lim{color:var(--amarillo)}
  .tiempos{font-weight:800;font-size:clamp(12px, calc(var(--u)*1.8), 28px)}
  .fila{display:flex;flex-wrap:wrap;gap:6px}
  .col.der .fila{justify-content:flex-end}
  .gol{display:inline-flex;align-items:center;gap:.25em;background:rgba(0,0,0,.28);border-radius:99px;padding:.15em .55em .15em .25em;font-family:Anton,Impact,sans-serif;color:var(--verde);font-size:clamp(15px, calc(var(--u)*2.4), 36px);-webkit-text-stroke:1px #000;paint-order:stroke fill}
  .gol:before{content:"⚽";-webkit-text-stroke:0}
  .tj{min-width:1.6em;padding:.2em .3em;border-radius:5px;border:3px solid #000;font-family:Anton,Impact,sans-serif;font-size:clamp(14px, calc(var(--u)*2.2), 32px);text-align:center;color:#000;background:var(--amarillo);box-shadow:3px 4px 0 rgba(0,0,0,.35)}
  .tj.r{background:var(--rojo);color:#fff}
  .exp{display:inline-flex;align-items:center;gap:.4em;font-family:Anton,Impact,sans-serif;color:var(--amarillo);font-size:clamp(16px, calc(var(--u)*2.8), 44px);background:#000;border-radius:10px;padding:.1em .5em}
  .exp:before{content:"🟥"}
  .lbl{font-size:clamp(10px, calc(var(--u)*1.3), 18px);opacity:.85;letter-spacing:.06em}

  /* ===== cuenta regresiva / placa / penales ===== */
  .aviso{margin-top:calc(var(--u)*2);background:#000;border-radius:22px;padding:calc(var(--u)*1.5) calc(var(--u)*4);text-align:center}
  .aviso h2{font-weight:900;font-size:clamp(18px, calc(var(--u)*3.4), 60px);white-space:pre-line}
  .aviso b{display:block;font-weight:900;font-size:clamp(50px, calc(var(--u)*11), 190px);font-variant-numeric:tabular-nums;color:#E6FFFF;line-height:1.05}
  .aviso b.ult{color:var(--amarillo)}
  .penales{display:flex;gap:.35em;flex-wrap:wrap;font-size:clamp(20px, calc(var(--u)*3.4), 54px)}
  .penales i{font-style:normal;width:1.1em;height:1.1em;border-radius:50%;display:grid;place-items:center;border:3px solid #000;font-size:.7em}
  .penales i.g{background:var(--verde)} .penales i.e{background:var(--rojo)}

  .sin{margin:calc(var(--u)*8) auto;text-align:center}
  .sin h2{font-weight:900;font-size:clamp(22px, calc(var(--u)*4.5), 70px)}
  .sin p{margin-top:12px;font-size:clamp(16px, calc(var(--u)*2.6), 40px)}
  footer{margin-top:auto;padding:10px;font-size:12px;opacity:.75;text-align:center}
  .oculto{display:none!important}

  /* pantalla (anfiteatro / Vnnox): ocupa todo, sin márgenes ni pie */
  
  body.pantalla footer{display:none}
  body.embebido{min-height:0;--u:min(1vw,14px)} body.embebido footer{display:none} body.embebido .sin{margin:30px auto}
  .escudo{display:flex;flex-direction:column;align-items:center}

  /* ===== PANTALLA ANCHA (anfiteatro / Vnnox, ?pantalla=1): diseño fijo de 1600x450 que se escala ===== */
  body.pantalla{display:block;width:100vw;height:100vh;min-height:0;overflow:hidden;position:relative}
  body.pantalla .wrap{position:absolute;left:0;top:0;width:1600px;height:450px;max-width:none;padding:12px 34px 14px;transform-origin:0 0;display:flex;flex-direction:column}
  body.pantalla header{flex-wrap:nowrap;gap:16px}
  body.pantalla #titulo{font-size:36px;white-space:nowrap}
  body.pantalla .pill{font-size:18px}
  body.pantalla #vivo{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;position:relative;min-height:0}
  body.pantalla #vivo.oculto{display:none}
  body.pantalla .marcador{grid-template-columns:1fr auto auto auto 1fr;grid-template-areas:"eqL gL rel gV eqV";align-items:center;gap:26px;margin-top:4px}
  body.pantalla .centro, body.pantalla .goles{display:contents}
  body.pantalla .goles{font-size:236px;-webkit-text-stroke:10px #000}
  body.pantalla .guion{display:none}
  body.pantalla #golL{grid-area:gL;line-height:.95} body.pantalla #golV{grid-area:gV;line-height:.95}
  body.pantalla #relojBox{grid-area:rel;margin:0;border-radius:30px;padding:4px 26px 10px}
  body.pantalla .reloj b{font-size:104px}
  body.pantalla .reloj span{font-size:30px}
  body.pantalla .equipo{flex-direction:row;align-items:center;gap:20px;min-width:0}
  body.pantalla .equipo:first-child{grid-area:eqL;justify-content:flex-start}
  body.pantalla .equipo:last-child{grid-area:eqV;flex-direction:row-reverse;justify-content:flex-start}
  body.pantalla .logo, body.pantalla .colores{width:160px}
  body.pantalla .logo{border-width:4px}
  body.pantalla .colores{height:16px;border-width:4px}
  body.pantalla .nombre{margin:0;font-size:40px;white-space:normal;line-height:1.05;padding:.18em .45em;flex:1;min-width:0}
  body.pantalla .datos{margin-top:0;grid-template-columns:1fr 1fr;gap:60px}
  body.pantalla .col{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;max-height:118px;overflow:hidden;align-content:flex-start}
  body.pantalla .col.der{flex-direction:row-reverse}
  body.pantalla .faltas{font-size:40px}
  body.pantalla .tiempos, body.pantalla .lbl{display:none}
  body.pantalla .col.der .fila{flex-direction:row-reverse}
  body.pantalla .gol{font-size:30px} body.pantalla .tj{font-size:28px} body.pantalla .exp{font-size:34px}
  body.pantalla .penales{font-size:40px}
  body.pantalla .aviso{position:absolute;left:400px;right:400px;top:0;bottom:118px;margin:0;display:flex;flex-direction:column;justify-content:center;border:4px solid var(--amarillo);border-radius:30px;padding:10px 20px;z-index:5}
  body.pantalla .aviso h2{font-size:44px}
  body.pantalla .aviso b{font-size:150px}
  body.pantalla .sin{margin:auto;flex:none}
  body.pantalla .sin h2{font-size:70px} body.pantalla .sin p{font-size:38px;margin-top:16px}
  @media (max-width:560px){ .datos{gap:10px} .reloj{padding:.1em .35em} .nombre{white-space:normal;font-size:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div id="titulo" class="trazo">MICROESTADIO</div>
    <div id="estado" class="pill"><span class="p"></span><span id="estadoTxt">CONECTANDO…</span></div>
  </header>

  <section id="vivo" class="oculto">
    <div id="aviso" class="aviso oculto"><h2 id="avisoTit" class="trazo"></h2><b id="avisoReloj">00:00</b></div>
    <div class="marcador">
      <div class="equipo">
        <div class="escudo"><div class="logo"><img id="logoL" alt=""></div>
        <div class="colores"><i id="c1L"></i><i id="c2L"></i></div></div>
        <div class="nombre" id="nomL">LOCAL</div>
      </div>
      <div class="centro">
        <div class="goles"><span id="golL">0</span><span class="guion">-</span><span id="golV">0</span></div>
        <div class="reloj" id="relojBox"><b id="reloj">00:00</b><span id="periodo">PRIMER TIEMPO</span></div>
      </div>
      <div class="equipo">
        <div class="escudo"><div class="logo"><img id="logoV" alt=""></div>
        <div class="colores"><i id="c1V"></i><i id="c2V"></i></div></div>
        <div class="nombre" id="nomV">VISITA</div>
      </div>
    </div>
    <div class="datos">
      <div class="col" id="colL"></div>
      <div class="col der" id="colV"></div>
    </div>
  </section>

  <section id="sin" class="sin oculto">
    <h2 class="trazo">NO HAY PARTIDO EN JUEGO</h2>
    <p id="proximo"></p>
  </section>
</div>
<footer>Microestadio · El Calafate — resultados en vivo</footer>

<script>
/* ============ CONFIGURACIÓN ============
   DB: dirección de la base de Firebase (la misma que se pone en AJUSTES del tablero).
   También se puede pasar en la dirección: pagina.html?db=https://....firebaseio.com
   Para la pantalla del anfiteatro: agregar ?pantalla=1                              */
const DB_POR_DEFECTO = "https://microestadio-calafate-default-rtdb.firebaseio.com";
const qs = new URLSearchParams(location.search);
const DB = (qs.get("db") || DB_POR_DEFECTO).replace(/\/$/, "");
if (qs.has("pantalla")) document.body.classList.add("pantalla");
const PANTALLA = qs.has("pantalla");
if (window.parent !== window && !PANTALLA) document.body.classList.add("embebido");

const $ = id => document.getElementById(id);
let D = null, leyo = false, recibido = 0, logos = {L:"", V:""}, nombresLogos = "";

// ----- reloj: la web lo calcula sola con la hora de arranque que manda el tablero -----
function ms(r){
  if (!r || !D) return 0;
  const off = (D.srv || D.t) - D.t;                    // diferencia entre el reloj de la PC y el del servidor
  let e = r.acc + (r.run ? (Date.now() - (r.t0 + off)) : 0);
  e = Math.max(0, Math.min(r.dur, e));
  return r.up ? e : r.dur - e;
}
function txt(r){
  const m = ms(r), s = r.up ? Math.floor(m/1000) : Math.ceil(m/1000);
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function colEquipo(e, der){
  let h = `<div class="faltas trazo">FALTAS: <b class="${e.faltas >= (D.limiteFaltas||5) ? "lim" : ""}">${e.faltas}</b></div>`;
  h += `<div class="tiempos trazo">TIEMPOS DISPONIBLES: ${e.tiempos}</div>`;
  if (e.exp && e.exp.show) h += `<div class="exp" data-exp="${der ? "V" : "L"}">${txt(e.exp)} EXPULSADO</div>`;
  if (e.goleadores && e.goleadores.length) h += `<div class="lbl">GOLES</div><div class="fila">${e.goleadores.map(g => `<span class="gol">${esc(g)}</span>`).join("")}</div>`;
  if (e.tarjetas && e.tarjetas.length) h += `<div class="lbl">TARJETAS</div><div class="fila">${e.tarjetas.map(t => `<span class="tj ${t.r ? "r" : ""}">${esc(t.n)}</span>`).join("")}</div>`;
  if (D.modo === "penales") h += `<div class="lbl">PENALES: ${(e.penales||[]).filter(x=>x==1).length}</div><div class="penales">${(e.penales||[]).map(x => `<i class="${x==1?"g":"e"}">${x==1?"✔":"✖"}</i>`).join("")}</div>`;
  return h;
}

// modo pantalla: todo el tablero se escala para entrar justo en la pantalla
function encajar(){
  if (!PANTALLA) return;
  const w = document.querySelector(".wrap");
  const sc = Math.min(innerWidth / 1600, innerHeight / 450);
  w.style.transform = `translate(${(innerWidth - 1600*sc)/2}px, ${(innerHeight - 450*sc)/2}px) scale(${sc})`;
}
encajar();
addEventListener("resize", encajar);

function pintar(){
  const ahora = Date.now();
  const edad = D ? (ahora - (D.t || 0)) : Infinity;       // cuánto hace que el tablero mandó algo
  const conectado = D && edad < 90e3;
  const reciente = D && edad < 4 * 3600e3;               // hasta 4 horas se muestra el último resultado

  const tit = D && D.titulo ? D.titulo : "MICROESTADIO";
  $("titulo").textContent = PANTALLA ? tit.replace(/\s*\n\s*/g, " ") : tit;
  $("estado").classList.toggle("final", !conectado);
  $("estadoTxt").textContent = !D ? "CONECTANDO…" : conectado ? "EN VIVO" : reciente ? "ÚLTIMO RESULTADO" : "SIN PARTIDO";
  $("vivo").classList.toggle("oculto", !reciente);
  $("sin").classList.toggle("oculto", !!reciente || !D);
  if (D) $("proximo").textContent = D.proximo ? "PRÓXIMO PARTIDO: " + D.proximo : "";
  if (!reciente) return;

  for (const [k, e] of [["L", D.local], ["V", D.visita]]) {
    $("nom"+k).textContent = e.nombre || (k === "L" ? "LOCAL" : "VISITA");
    $("gol"+k).textContent = e.goles;
    $("c1"+k).style.background = e.c1 || "#fff";
    $("c2"+k).style.background = e.c2 || "#fff";
    const img = $("logo"+k);
    if (logos[k]) { if (img.src !== logos[k]) img.src = logos[k]; img.style.display = ""; } else img.style.display = "none";
  }
  const minuto = D.minuto && D.minuto.show;
  $("relojBox").classList.toggle("minuto", !!minuto);
  if (minuto) { $("reloj").textContent = txt(D.minuto); $("periodo").textContent = "MINUTO"; }
  else {
    $("reloj").textContent = txt(D.reloj);
    $("periodo").textContent = D.modo === "penales" ? "PENALES" : D.periodo;
    $("reloj").classList.toggle("ult", !D.reloj.up ? ms(D.reloj) <= 60000 : (D.reloj.dur - ms(D.reloj)) <= 60000);
  }
  // cuenta regresiva (entretiempo / comienzo) o placa de premiación
  const cuenta = D.modo === "cuenta", placa = D.modo === "placa";
  $("aviso").classList.toggle("oculto", !(cuenta || placa));
  if (cuenta) { $("avisoTit").textContent = D.cuentaTitulo; $("avisoReloj").textContent = txt(D.cuenta); $("avisoReloj").style.display = ""; $("avisoReloj").classList.toggle("ult", ms(D.cuenta) <= 60000); }
  if (placa) { $("avisoTit").textContent = D.placa; $("avisoReloj").style.display = "none"; }

  const hL = colEquipo(D.local, false), hV = colEquipo(D.visita, true);
  if ($("colL").innerHTML !== hL) $("colL").innerHTML = hL;
  if ($("colV").innerHTML !== hV) $("colV").innerHTML = hV;
  avisarAlto();
  const alto = document.querySelector(".wrap").scrollHeight;
  if (alto !== ultimoAlto) { ultimoAlto = alto; encajar(); }
}
let ultimoAlto = 0;

async function leer(){
  try {
    const r = await fetch(DB + "/tablero/vivo.json", {cache: "no-store"});
    const d = await r.json();
    leyo = true;
    if (d) { D = d; recibido = Date.now(); } else if (!D) sinPartido();
    const n = D ? (D.local.nombre + "|" + D.visita.nombre) : "";
    if (n !== nombresLogos) { nombresLogos = n; leerLogos(); }
  } catch (e) { /* sin internet: se sigue mostrando lo último */ }
}
async function leerLogos(){
  for (const k of ["L","V"]) {
    try { const r = await fetch(DB + "/tablero/logos/" + k + ".json", {cache: "no-store"}); logos[k] = (await r.json()) || ""; } catch (e) {}
  }
}

// si la página está incrustada (iframe en la web de la muni), le avisa su altura para que no haya barra de desplazamiento
let altoAvisado = 0;
function avisarAlto(){
  if (window.parent === window) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height) + 8;
  if (Math.abs(h - altoAvisado) > 4) { altoAvisado = h; window.parent.postMessage({microestadioAlto: h}, "*"); }
}
addEventListener("load", avisarAlto); addEventListener("resize", avisarAlto);
function sinPartido(){
  $("estado").classList.add("final");
  $("estadoTxt").textContent = "SIN PARTIDO";
  $("vivo").classList.add("oculto");
  $("sin").classList.remove("oculto");
  avisarAlto();
}
leer(); setInterval(leer, 3000);
setInterval(() => { if (D) pintar(); }, 250);
setInterval(leerLogos, 120000);
setTimeout(() => { if (!D) sinPartido(); }, 8000);
</script>
</body>
</html>
